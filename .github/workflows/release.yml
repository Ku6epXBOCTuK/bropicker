name: Deploy release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.XBOCT_BOT_ID }}
          private-key: ${{ secrets.XBOCT_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup Cocogitto
        uses: ./.github/actions/setup-cocogitto

      - name: Sync and Reset
        run: |
          git fetch origin main --tags --force
          git reset --hard origin/main

      - name: Get Changelog
        id: version_info
        shell: bash
        run: |
          VERSION=${{ inputs.version }}
          echo "Get changelog for $VERSION"
          cog changelog $VERSION > GITHUB_CHANGELOG.md
          if [ ! -s GITHUB_CHANGELOG.md ]; then
            echo "Release version $VERSION" > GITHUB_CHANGELOG.md
            echo "::warning title=Changelog::Changelog was empty, used default text."
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download release binary
        id: download-bin
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bropicker-exe
          path: target/release

      - name: Cache cargo
        if: steps.download-bin.outcome != 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        if: steps.download-bin.outcome != 'success'
        run: cargo build --release

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path target\release\bropicker.exe -DestinationPath release\bropicker-windows-x86_64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body_path: GITHUB_CHANGELOG.md
          token: ${{ steps.generate_token.outputs.token }}
          files: release/*.zip
