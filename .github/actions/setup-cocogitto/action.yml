name: "Setup Cocogitto"
description: "Installs a specific version of Cocogitto and cleans up the workspace"
inputs:
  version:
    description: "Cocogitto version to install"
    required: true
    default: "7.0.0"

runs:
  using: "composite"
  steps:
    - name: Install Cocogitto (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        URL="https://github.com/cocogitto/cocogitto/releases/download/${VERSION}/cocogitto-${VERSION}-x86_64-unknown-linux-musl.tar.gz"

        curl -LOf "$URL"
        tar -xzf "cocogitto-${VERSION}-x86_64-unknown-linux-musl.tar.gz"

        sudo mv $(find . -name cog -type f -executable) /usr/local/bin/
        git clean -fd
        cog --version

    - name: Install Cocogitto (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        URL="https://github.com/cocogitto/cocogitto/releases/download/${VERSION}/cocogitto-${VERSION}-x86_64-pc-windows-msvc.tar.gz"

        curl -LOf "$URL"
        tar -xzf "cocogitto-${VERSION}-x86_64-pc-windows-msvc.tar.gz"

        COG_PATH="$(find . -name cog.exe -type f | head -n 1)"
        BIN_DIR="$(cygpath -w "$HOME/bin")"
        mkdir -p "$HOME/bin"
        mv "$COG_PATH" "$HOME/bin/cog.exe"
        echo "$BIN_DIR" >> $GITHUB_PATH

        git clean -fd
        cog --version
