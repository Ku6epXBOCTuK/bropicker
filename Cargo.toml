[package]
name = "bropicker"
version = "0.0.1"
edition = "2024"
build = "build.rs"

[dependencies]
i-slint-backend-winit = "1.16.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slint = { version = "1.16.1", features = ["renderer-skia", "serde"] }
toml = "1.1.4"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
winit = "0.30"
winreg = "0.56.0"

[build-dependencies]
slint-build = "1.16.1"
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
